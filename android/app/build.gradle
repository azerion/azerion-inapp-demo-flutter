plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.azerion.ads.testapp.flutter"
    // bluestack_sdk_flutter compiles against Android SDK 36.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion
   
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.azerion.ads.testapp.flutterdemo"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // The AppLovin adapter needs API 24.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

repositories {
    google()
    mavenCentral()
    maven {
        url "https://packagecloud.io/smartadserver/android/maven2" 
    }
    maven {
        url "https://artifactory.bidmachine.io/bidmachine"
    }
}

dependencies {
    implementation 'com.azerion:bluestack-mediation-bidding:6.0.6.2'
    implementation 'com.azerion:bluestack-mediation-google:6.1.0.1'
    implementation 'com.azerion:bluestack-mediation-equativ:6.0.0.4'
    implementation 'com.azerion:bluestack-mediation-bidmachine:6.1.0.1'
    implementation 'com.azerion:bluestack-mediation-applovin:6.1.0.0'
}
