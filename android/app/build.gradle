import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// def resolvedFlutterNdkVersion = localProperties.getProperty("flutter.ndkVersion")?.trim()
// if (!resolvedFlutterNdkVersion) {
//     resolvedFlutterNdkVersion = flutter.ndkVersion
// }

android {
    namespace = "com.azerion.ads.testapp.flutter"
    // Explicitly compile against Android SDK 35 to satisfy media3 and bluestack_sdk_flutter requirements.
    compileSdk = 35
    ndkVersion = localProperties.getProperty("flutter.ndkVersion") ?: flutter.ndkVersion
   
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.azerion.ads.testapp.flutter"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

repositories {
    google()
    mavenCentral()
    maven {
        url "https://packagecloud.io/smartadserver/android/maven2" 
    }
}

dependencies {
    implementation 'com.azerion:bluestack-mediation-bidding:5.1.4.0'
    implementation 'com.azerion:bluestack-mediation-google:5.1.4.0'
    implementation 'com.azerion:bluestack-mediation-equativ:5.2.1.0'

}