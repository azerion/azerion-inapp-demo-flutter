name: bluestack_demo_flutter
description: Flutter Demo App for BlueStack SDK
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.3.6
  go_router: ^10.0.0
  webview_flutter: ^4.2.2
  shared_preferences: ^2.2.0
  flutter_slidable: ^3.0.0
  bluestack_sdk_flutter: ^2.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/